# Music rooms: play exactly an item whose Music Assistant address is longer than the Tessera app gives a plugin (a
# Spotify playlist's or artist's, about 50 characters; the app keeps 48). The screen sends the address as far as it
# has it (`start`), with the item's name and kind; this script searches Music Assistant by that name and plays the one
# result whose address starts so. When none does, it plays by name, as the screen did before.
#
# Add it in Home Assistant as a script with the id music_rooms_play (Settings, Automations & scenes, Scripts, Add
# script, Edit in YAML, paste this), then give each screen `play_script: script.music_rooms_play` (see the README).
alias: Music rooms – play exactly
description: Plays the Music Assistant item whose address starts as the screen's cut one.
fields:
  artist:
    description: The item's artist, for a track or an album.
  entry:
    description: The Music Assistant config entry.
  kind:
    description: playlist, artist, album, track, radio or podcast.
  name:
    description: The item's name.
  player:
    description: The media player to play on.
  start:
    description: The item's address as far as the screen has it.
max: 20
mode: parallel
sequence:
- alias: 'Whole House plays everywhere: free its rooms held by another group, then put back every room it is missing'
  if:
  - condition: template
    value_template: '{{ player == ''media_player.whole_house'' }}'
  then:
  - variables:
      busy: '{% set ns = namespace(out=[]) %}{% for m in [''media_player.living_room_google_home_2'', ''media_player.stereo_3'',
        ''media_player.living_room_tv_4'', ''media_player.aftr_64_formal_room_airplay'', ''media_player.family_room_display'']
        %}{% if (state_attr(m, ''group_members'') or []) | length > 1 and m not in (state_attr(player, ''group_members'')
        or []) %}{% set ns.out = ns.out + [m] %}{% endif %}{% endfor %}{{ ns.out }}'
  - if:
    - condition: template
      value_template: '{{ busy | length > 0 }}'
    then:
    - action: media_player.unjoin
      continue_on_error: true
      target:
        entity_id: '{{ busy }}'
    - action: media_player.media_stop
      continue_on_error: true
      target:
        entity_id: '{{ busy | select(''is_state'', ''playing'') | list }}'
    - delay:
        seconds: 1
  - variables:
      missing: '{{ [''media_player.living_room_google_home_2'', ''media_player.stereo_3'', ''media_player.living_room_tv_4'',
        ''media_player.aftr_64_formal_room_airplay'', ''media_player.family_room_display''] | reject(''in'', state_attr(player,
        ''group_members'') or []) | reject(''is_state'', ''unavailable'') | list }}'
  - if:
    - condition: template
      value_template: '{{ missing | length > 0 }}'
    then:
    - action: media_player.join
      continue_on_error: true
      data:
        group_members: '{{ missing }}'
      target:
        entity_id: '{{ player }}'
    - delay:
        seconds: 2
- action: music_assistant.search
  data:
    config_entry_id: '{{ entry }}'
    library_only: false
    limit: 25
    media_type:
    - '{{ kind }}'
    name: '{{ name }}'
  response_variable: found
- variables:
    exact: '{% set lists = {''playlist'': ''playlists'', ''artist'': ''artists'', ''album'': ''albums'', ''track'': ''tracks'',
      ''radio'': ''radio'', ''podcast'': ''podcasts''} %}{% set ns = namespace(uri='''') %}{% for item in found.get(lists.get(kind,
      ''''), []) if ns.uri == '''' and (item.uri | default('''')).startswith(start) %}{% set ns.uri = item.uri %}{% endfor
      %}{{ ns.uri }}'
- else:
  - action: music_assistant.play_media
    data:
      media_id: '{{ name }}'
      media_type: '{{ kind }}'
    target:
      entity_id: '{{ player }}'
  if:
  - condition: template
    value_template: '{{ exact | trim != '''' }}'
  then:
  - action: media_player.play_media
    data:
      media_content_id: '{{ exact | trim }}'
      media_content_type: '{{ kind }}'
    target:
      entity_id: '{{ player }}'
