# Music rooms: add rooms to what a player plays.
#
# - The room in charge is the Music Assistant group player (Whole House) when the player plays in its queue, otherwise
#   the lead of the player's group (the first of its group_members): Music Assistant ignores a join to a member.
# - A room that can group (a Cast, a Sonos) joins it in step.
# - A Music Assistant group player ticked takes the music over (music_assistant.transfer_queue).
# - A room that cannot play in step (a screen's own speaker, on either side) gets the music moved to it, and the other
#   ticked rooms that can group join it there. (A copy on both is no help: a Spotify account that allows one stream at
#   a time stops one of them.)
#
# Add it in Home Assistant as a script with the id music_rooms_join (Settings, Automations & scenes, Scripts, Add
# script, Edit in YAML, paste this), then give each screen `join_script: script.music_rooms_join` under `music_rooms:`.
# - With move: true (the screen's Move here), what plays moves to the first of members alone.
alias: Music rooms – join rooms
description: 'Adds rooms to what a player plays: a room that can group with it (a Cast or Sonos speaker) joins the group through
  its lead (the first of group_members); a Music Assistant group player (Whole House) takes the music over; a room of the
  playing Music Assistant group that already plays is left as it is. A room that cannot play in step with it (a screen''s
  own speaker, or any room while a screen''s speaker plays) gets the music moved to it (music_assistant.transfer_queue), and
  the other ticked rooms that can group join it there. With move, what plays moves to the first of members alone (music_assistant.transfer_queue).'
fields:
  members:
    description: The rooms to add.
    selector:
      entity:
        domain: media_player
        multiple: true
  player:
    description: The room that plays (its lead, a member, or a Music Assistant group player).
    selector:
      entity:
        domain: media_player
  move:
    description: Move the music to the first of members alone instead of adding them.
    selector:
      boolean: {}
max: 20
mode: queued
sequence:
- variables:
    owner: '{% set q = state_attr(player, ''active_queue'') %}{% set g = states.media_player | selectattr(''attributes.mass_player_type'',
      ''defined'') | selectattr(''attributes.mass_player_type'', ''eq'', ''group'') | selectattr(''attributes.active_queue'',
      ''defined'') | selectattr(''attributes.active_queue'', ''eq'', q) | map(attribute=''entity_id'') | list %}{{ g[0] if
      q and g and is_state(g[0], [''playing'', ''paused'', ''buffering'']) else player }}'
- variables:
    group: '{{ state_attr(owner, ''group_members'') or [] }}'
    player_group: '{{ is_state_attr(owner, ''mass_player_type'', ''group'') }}'
- variables:
    lead: '{{ owner if player_group else (group[0] if group | length > 1 else player) }}'
- if:
  - condition: template
    value_template: '{{ move | default(false) | bool }}'
  then:
  - variables:
      to: '{{ (members if members is list else [members]) | first }}'
  - if:
    - condition: template
      value_template: '{{ to != lead and states(lead) in [''playing'', ''paused'', ''buffering''] }}'
    then:
    - if:
      - condition: template
        value_template: '{{ not player_group and to in group }}'
      then:
      - action: media_player.unjoin
        continue_on_error: true
        target:
          entity_id: '{{ to }}'
      - delay:
          seconds: 1
    - action: music_assistant.transfer_queue
      continue_on_error: true
      data:
        auto_play: true
        source_player: '{{ lead }}'
      target:
        entity_id: '{{ to }}'
  - stop: Moved.
- variables:
    asked: '{{ (members if members is list else [members]) | reject(''eq'', lead) | reject(''eq'', player) | reject(''eq'',
      owner) | list }}'
- variables:
    groups: '{{ asked | select(''is_state_attr'', ''mass_player_type'', ''group'') | list }}'
- variables:
    playing_in_group: '{{ (group if player_group else []) | select(''is_state'', [''playing'', ''paused'', ''buffering''])
      | list }}'
- variables:
    rest: '{{ asked | reject(''in'', groups) | reject(''in'', playing_in_group) | list }}'
- variables:
    joinable: '{% set ns = namespace(out=[]) %}{% if not player_group and ((state_attr(lead, ''supported_features'') | int(0))
      // 524288) % 2 == 1 %}{% for r in rest %}{% if ((state_attr(r, ''supported_features'') | int(0)) // 524288) % 2 == 1
      %}{% set ns.out = ns.out + [r] %}{% endif %}{% endfor %}{% endif %}{{ ns.out }}'
- variables:
    lead_groups: '{{ not player_group and ((state_attr(lead, ''supported_features'') | int(0)) // 524288) % 2 == 1 }}'
    moves: '{{ rest | reject(''in'', joinable) | list }}'
- repeat:
    for_each: '{{ groups }}'
    sequence:
    - action: music_assistant.transfer_queue
      continue_on_error: true
      data:
        auto_play: true
        source_player: '{{ lead }}'
      target:
        entity_id: '{{ repeat.item }}'
- if:
  - condition: template
    value_template: '{{ joinable | length > 0 }}'
  then:
  - action: media_player.join
    continue_on_error: true
    data:
      group_members: '{{ joinable }}'
    target:
      entity_id: '{{ lead }}'
- if:
  - condition: template
    value_template: '{{ not player_group and groups | length == 0 and joinable | length == 0 and moves | length > 0 and states(lead)
      in [''playing'', ''paused'', ''buffering''] }}'
  then:
  - action: music_assistant.transfer_queue
    continue_on_error: true
    data:
      auto_play: true
      source_player: '{{ lead }}'
    target:
      entity_id: '{{ moves[0] }}'
  - variables:
      more: '{% set ns = namespace(out=[]) %}{% if ((state_attr(moves[0], ''supported_features'') | int(0)) // 524288) % 2
        == 1 %}{% for r in moves[1:] %}{% if ((state_attr(r, ''supported_features'') | int(0)) // 524288) % 2 == 1 %}{% set
        ns.out = ns.out + [r] %}{% endif %}{% endfor %}{% endif %}{{ ns.out }}'
  - if:
    - condition: template
      value_template: '{{ more | length > 0 }}'
    then:
    - action: media_player.join
      continue_on_error: true
      data:
        group_members: '{{ more }}'
      target:
        entity_id: '{{ moves[0] }}'
