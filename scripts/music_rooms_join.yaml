# Music rooms: add rooms to what a player plays.
#
# - The room in charge is the Music Assistant group player (Whole House) when the player plays in its queue, otherwise
#   the lead of the player's group (the first of its group_members): Music Assistant ignores a join to a member.
# - A room that can group (a Cast, a Sonos) joins it in step.
# - A Music Assistant group player ticked takes the music over (music_assistant.transfer_queue).
# - A room that cannot play in step (a screen's own speaker, on either side) gets the music moved to it, and the other
#   ticked rooms that can group join it there. (A copy on both is no help: a Spotify account that allows one stream at
#   a time stops one of them.)
#
# Add it in Home Assistant as a script with the id music_rooms_join (Settings, Automations & scenes, Scripts, Add
# script, Edit in YAML, paste this), then give each screen `join_script: script.music_rooms_join` under `music_rooms:`.
# - With leave: true (a room unticked on the screen), the rooms leave the group; when the lead leaves, the music goes
#   on in the rooms left (transfer_queue to the first, the others join it). A room already grouped is not joined again.
# - With toggle: true (a room tapped while Whole House plays), a member that plays leaves Whole House and any other
#   room joins it.
# - With move: true (the screen's Move here), what plays moves to the first of members alone.
alias: Music rooms – join rooms
description: 'Adds rooms to what a player plays: a room that can group with it (a Cast or Sonos speaker) joins the group through
  its lead (the first of group_members); a Music Assistant group player (Whole House) takes the music over; a room of the
  playing Music Assistant group that already plays is left as it is. A room that cannot play in step with it (a screen''s
  own speaker, or any room while a screen''s speaker plays) gets the music moved to it (music_assistant.transfer_queue), and
  the other ticked rooms that can group join it there. With move, what plays moves to the first of members alone (music_assistant.transfer_queue).
  With toggle, while a Music Assistant group player plays, a member that plays leaves it and any other room joins it.'
fields:
  members:
    description: The rooms to add.
    selector:
      entity:
        domain: media_player
        multiple: true
  player:
    description: The room that plays (its lead, a member, or a Music Assistant group player).
    selector:
      entity:
        domain: media_player
  move:
    description: Move the music to the first of members alone instead of adding them.
    selector:
      boolean: {}
  leave:
    description: Take members out of the group instead of adding them; when the lead leaves, the music goes on in the rooms
      left.
    selector:
      boolean: {}
  toggle:
    description: 'While a Music Assistant group player (Whole House) plays: a member that plays leaves it, any other room
      joins it.'
    selector:
      boolean: {}
max: 20
mode: queued
sequence:
- variables:
    owner: '{% set q = state_attr(player, ''active_queue'') %}{% set g = states.media_player | selectattr(''attributes.mass_player_type'',
      ''defined'') | selectattr(''attributes.mass_player_type'', ''eq'', ''group'') | selectattr(''attributes.active_queue'',
      ''defined'') | selectattr(''attributes.active_queue'', ''eq'', q) | map(attribute=''entity_id'') | list %}{{ g[0] if
      q and g and is_state(g[0], [''playing'', ''paused'', ''buffering'']) else player }}'
- variables:
    group: '{{ state_attr(owner, ''group_members'') or [] }}'
    player_group: '{{ is_state_attr(owner, ''mass_player_type'', ''group'') }}'
- variables:
    lead: '{{ owner if player_group else (group[0] if group | length > 1 else player) }}'
- if:
  - condition: template
    value_template: '{{ move | default(false) | bool }}'
  then:
  - variables:
      to: '{{ (members if members is list else [members]) | first }}'
  - if:
    - condition: template
      value_template: '{{ to != lead and states(lead) in [''playing'', ''paused'', ''buffering''] }}'
    then:
    - alias: 'Moving to a Music Assistant group: free all of its rooms (Whole House: every room) held by another group first'
      if:
      - condition: template
        value_template: '{{ is_state_attr(to, ''mass_player_type'', ''group'') }}'
      then:
      - variables:
          wh_full: '{{ [''media_player.living_room_google_home_2'', ''media_player.stereo_3'', ''media_player.living_room_tv_4'',
            ''media_player.aftr_64_formal_room_airplay'', ''media_player.family_room_display''] if to == ''media_player.whole_house''
            else (state_attr(to, ''group_members'') or []) }}'
      - variables:
          busy: '{% set ns = namespace(out=[]) %}{% for m in wh_full %}{% if m != lead and (state_attr(m, ''group_members'')
            or []) | length > 1 and m not in (state_attr(to, ''group_members'') or []) %}{% set ns.out = ns.out + [m] %}{%
            endif %}{% endfor %}{{ ns.out }}'
      - if:
        - condition: template
          value_template: '{{ busy | length > 0 }}'
        then:
        - action: media_player.unjoin
          continue_on_error: true
          target:
            entity_id: '{{ busy }}'
        - action: media_player.media_stop
          continue_on_error: true
          target:
            entity_id: '{{ busy | select(''is_state'', ''playing'') | list }}'
        - delay:
            seconds: 1
    - if:
      - condition: template
        value_template: '{{ to in group }}'
      then:
      - action: media_player.unjoin
        continue_on_error: true
        target:
          entity_id: '{{ to }}'
      - delay:
          seconds: 1
    - alias: 'Pause what plays first: a Spotify account plays one stream at a time'
      action: media_player.media_pause
      continue_on_error: true
      target:
        entity_id: '{{ lead }}'
    - delay:
        seconds: 1
    - action: music_assistant.transfer_queue
      continue_on_error: true
      data:
        auto_play: true
        source_player: '{{ lead }}'
      target:
        entity_id: '{{ to }}'
    - alias: 'Whole House: put back every room it is missing'
      if:
      - condition: template
        value_template: '{{ to == ''media_player.whole_house'' }}'
      then:
      - delay:
          seconds: 2
      - variables:
          missing: '{{ [''media_player.living_room_google_home_2'', ''media_player.stereo_3'', ''media_player.living_room_tv_4'',
            ''media_player.aftr_64_formal_room_airplay'', ''media_player.family_room_display''] | reject(''in'', state_attr(to,
            ''group_members'') or []) | reject(''is_state'', ''unavailable'') | list }}'
      - if:
        - condition: template
          value_template: '{{ missing | length > 0 }}'
        then:
        - action: media_player.join
          continue_on_error: true
          data:
            group_members: '{{ missing }}'
          target:
            entity_id: '{{ to }}'
    - alias: 'A move never ends silent: play there if it has not started'
      wait_template: '{{ is_state(to, ''playing'') }}'
      timeout:
        seconds: 8
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not is_state(to, ''playing'') }}'
      then:
      - action: media_player.media_play
        continue_on_error: true
        target:
          entity_id: '{{ to }}'
  - stop: Moved.
- if:
  - condition: template
    value_template: '{{ leave | default(false) | bool }}'
  then:
  - variables:
      leaving: '{{ members if members is list else [members] }}'
      real_group: '{{ (state_attr(lead, ''group_members'') or []) if not player_group else group }}'
  - variables:
      staying: '{{ real_group | reject(''in'', leaving) | list }}'
  - alias: 'Whole House unticked: the music goes on in the speakers that played in it, as a group of their own'
    if:
    - condition: template
      value_template: '{{ player_group and owner in leaving and states(owner) in [''playing'', ''paused'', ''buffering'']
        }}'
    then:
    - variables:
        keep: '{% set ns = namespace(out=[]) %}{% for m in group %}{% if m != owner and states(m) in [''playing'', ''paused'',
          ''buffering''] and ((state_attr(m, ''supported_features'') | int(0)) // 524288) % 2 == 1 %}{% set ns.out = ns.out
          + [m] %}{% endif %}{% endfor %}{{ ns.out }}'
    - if:
      - condition: template
        value_template: '{{ keep | length > 0 }}'
      then:
      - alias: 'Pause what plays first: a Spotify account plays one stream at a time'
        action: media_player.media_pause
        continue_on_error: true
        target:
          entity_id: '{{ owner }}'
      - action: media_player.unjoin
        continue_on_error: true
        target:
          entity_id: '{{ keep }}'
      - delay:
          seconds: 1
      - action: music_assistant.transfer_queue
        continue_on_error: true
        data:
          auto_play: true
          source_player: '{{ owner }}'
        target:
          entity_id: '{{ keep[0] }}'
      - alias: 'A move never ends silent: play there if it has not started'
        wait_template: '{{ is_state(keep[0], ''playing'') }}'
        timeout:
          seconds: 8
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not is_state(keep[0], ''playing'') }}'
        then:
        - action: media_player.media_play
          continue_on_error: true
          target:
            entity_id: '{{ keep[0] }}'
      - if:
        - condition: template
          value_template: '{{ keep | length > 1 }}'
        then:
        - delay:
            seconds: 2
        - action: media_player.join
          continue_on_error: true
          data:
            group_members: '{{ keep[1:] }}'
          target:
            entity_id: '{{ keep[0] }}'
    - stop: Left.
  - if:
    - condition: template
      value_template: '{{ not player_group and lead in leaving and staying | length > 0 and states(lead) in [''playing'',
        ''paused'', ''buffering''] }}'
    then:
    - action: media_player.unjoin
      continue_on_error: true
      target:
        entity_id: '{{ real_group | reject("eq", lead) | list }}'
    - delay:
        seconds: 1
    - action: music_assistant.transfer_queue
      continue_on_error: true
      data:
        auto_play: true
        source_player: '{{ lead }}'
      target:
        entity_id: '{{ staying[0] }}'
    - alias: 'A move never ends silent: play there if it has not started'
      wait_template: '{{ is_state(staying[0], ''playing'') }}'
      timeout:
        seconds: 8
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not is_state(staying[0], ''playing'') }}'
      then:
      - action: media_player.media_play
        continue_on_error: true
        target:
          entity_id: '{{ staying[0] }}'
    - if:
      - condition: template
        value_template: '{{ staying | length > 1 }}'
      then:
      - delay:
          seconds: 2
      - action: media_player.join
        continue_on_error: true
        data:
          group_members: '{{ staying[1:] }}'
        target:
          entity_id: '{{ staying[0] }}'
    else:
    - action: media_player.unjoin
      continue_on_error: true
      target:
        entity_id: '{{ leaving | reject("eq", owner) | list }}'
  - stop: Left.
- if:
  - condition: template
    value_template: '{{ (toggle | default(false) | bool) and player_group }}'
  then:
  - variables:
      room: '{{ (members if members is list else [members]) | first }}'
  - if:
    - condition: template
      value_template: '{{ room in group and states(room) in [''playing'', ''paused'', ''buffering''] }}'
    then:
    - action: media_player.unjoin
      continue_on_error: true
      target:
        entity_id: '{{ room }}'
    else:
    - action: media_player.join
      continue_on_error: true
      data:
        group_members:
        - '{{ room }}'
      target:
        entity_id: '{{ owner }}'
  - stop: Toggled.
- variables:
    asked: '{{ (members if members is list else [members]) | reject(''eq'', lead) | reject(''eq'', player) | reject(''eq'',
      owner) | list }}'
- variables:
    groups: '{{ asked | select(''is_state_attr'', ''mass_player_type'', ''group'') | list }}'
- variables:
    playing_in_group: '{{ (group if player_group else []) | select(''is_state'', [''playing'', ''paused'', ''buffering''])
      | list }}'
- variables:
    rest: '{% set together = state_attr(lead, ''group_members'') or [] %}{% set ns = namespace(out=[]) %}{% for r in asked
      | reject(''in'', groups) | reject(''in'', playing_in_group) %}{% if r not in together and lead not in (state_attr(r,
      ''group_members'') or []) %}{% set ns.out = ns.out + [r] %}{% endif %}{% endfor %}{{ ns.out }}'
- variables:
    joinable: '{% set ns = namespace(out=[]) %}{% if not player_group and ((state_attr(lead, ''supported_features'') | int(0))
      // 524288) % 2 == 1 %}{% for r in rest %}{% if ((state_attr(r, ''supported_features'') | int(0)) // 524288) % 2 == 1
      %}{% set ns.out = ns.out + [r] %}{% endif %}{% endfor %}{% endif %}{{ ns.out }}'
- variables:
    lead_groups: '{{ not player_group and ((state_attr(lead, ''supported_features'') | int(0)) // 524288) % 2 == 1 }}'
    moves: '{{ rest | reject(''in'', joinable) | list }}'
- repeat:
    for_each: '{{ groups }}'
    sequence:
    - alias: 'Moving to a Music Assistant group: free all of its rooms (Whole House: every room) held by another group first'
      if:
      - condition: template
        value_template: '{{ is_state_attr(repeat.item, ''mass_player_type'', ''group'') }}'
      then:
      - variables:
          wh_full: '{{ [''media_player.living_room_google_home_2'', ''media_player.stereo_3'', ''media_player.living_room_tv_4'',
            ''media_player.aftr_64_formal_room_airplay'', ''media_player.family_room_display''] if repeat.item == ''media_player.whole_house''
            else (state_attr(repeat.item, ''group_members'') or []) }}'
      - variables:
          busy: '{% set ns = namespace(out=[]) %}{% for m in wh_full %}{% if m != lead and (state_attr(m, ''group_members'')
            or []) | length > 1 and m not in (state_attr(repeat.item, ''group_members'') or []) %}{% set ns.out = ns.out +
            [m] %}{% endif %}{% endfor %}{{ ns.out }}'
      - if:
        - condition: template
          value_template: '{{ busy | length > 0 }}'
        then:
        - action: media_player.unjoin
          continue_on_error: true
          target:
            entity_id: '{{ busy }}'
        - action: media_player.media_stop
          continue_on_error: true
          target:
            entity_id: '{{ busy | select(''is_state'', ''playing'') | list }}'
        - delay:
            seconds: 1
    - action: music_assistant.transfer_queue
      continue_on_error: true
      data:
        auto_play: true
        source_player: '{{ lead }}'
      target:
        entity_id: '{{ repeat.item }}'
    - alias: 'Whole House: put back every room it is missing'
      if:
      - condition: template
        value_template: '{{ repeat.item == ''media_player.whole_house'' }}'
      then:
      - delay:
          seconds: 2
      - variables:
          missing: '{{ [''media_player.living_room_google_home_2'', ''media_player.stereo_3'', ''media_player.living_room_tv_4'',
            ''media_player.aftr_64_formal_room_airplay'', ''media_player.family_room_display''] | reject(''in'', state_attr(repeat.item,
            ''group_members'') or []) | reject(''is_state'', ''unavailable'') | list }}'
      - if:
        - condition: template
          value_template: '{{ missing | length > 0 }}'
        then:
        - action: media_player.join
          continue_on_error: true
          data:
            group_members: '{{ missing }}'
          target:
            entity_id: '{{ repeat.item }}'
    - alias: 'A move never ends silent: play there if it has not started'
      wait_template: '{{ is_state(repeat.item, ''playing'') }}'
      timeout:
        seconds: 8
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not is_state(repeat.item, ''playing'') }}'
      then:
      - action: media_player.media_play
        continue_on_error: true
        target:
          entity_id: '{{ repeat.item }}'
- if:
  - condition: template
    value_template: '{{ joinable | length > 0 }}'
  then:
  - action: media_player.join
    continue_on_error: true
    data:
      group_members: '{{ joinable }}'
    target:
      entity_id: '{{ lead }}'
- if:
  - condition: template
    value_template: '{{ not player_group and groups | length == 0 and joinable | length == 0 and moves | length > 0 and states(lead)
      in [''playing'', ''paused'', ''buffering''] }}'
  then:
  - action: music_assistant.transfer_queue
    continue_on_error: true
    data:
      auto_play: true
      source_player: '{{ lead }}'
    target:
      entity_id: '{{ moves[0] }}'
  - alias: 'A move never ends silent: play there if it has not started'
    wait_template: '{{ is_state(moves[0], ''playing'') }}'
    timeout:
      seconds: 8
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ not is_state(moves[0], ''playing'') }}'
    then:
    - action: media_player.media_play
      continue_on_error: true
      target:
        entity_id: '{{ moves[0] }}'
  - variables:
      more: '{% set ns = namespace(out=[]) %}{% if ((state_attr(moves[0], ''supported_features'') | int(0)) // 524288) % 2
        == 1 %}{% for r in moves[1:] %}{% if ((state_attr(r, ''supported_features'') | int(0)) // 524288) % 2 == 1 %}{% set
        ns.out = ns.out + [r] %}{% endif %}{% endfor %}{% endif %}{{ ns.out }}'
  - if:
    - condition: template
      value_template: '{{ more | length > 0 }}'
    then:
    - action: media_player.join
      continue_on_error: true
      data:
        group_members: '{{ more }}'
      target:
        entity_id: '{{ moves[0] }}'
